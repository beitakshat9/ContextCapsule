<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Context Capsule - Research Vault</title>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.6.1/dist/mermaid.min.js"></script>
  <script>mermaid.initialize({ startOnLoad: false, theme: 'default', background: 'transparent' });</script>
  <style>
    :root {
      --bg-color: #f1f5f9; --text-main: #1e293b; --text-muted: #64748b;
      --border: #e2e8f0; --primary: #0ea5e9; --primary-hover: #0284c7;
      --sidebar-bg: #0b1120; --danger: #ef4444;
    }
    
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg-color); color: var(--text-main); margin: 0; display: flex; min-height: 100vh; }
    
    /* Sidebar Styling */
    .sidebar { width: 250px; background: var(--sidebar-bg); color: white; padding: 24px 16px; display: flex; flex-direction: column; position: fixed; height: 100vh; overflow-y: auto; box-shadow: 4px 0 20px rgba(0,0,0,0.15); z-index: 10; }
    .sidebar-title { font-size: 16px; font-weight: 800; margin-bottom: 24px; display: flex; align-items: center; gap: 8px; color: #f8fafc; padding-left: 8px; text-transform: uppercase; letter-spacing: 1px; opacity: 0.8; }
    
    .workspace-wrapper { position: relative; margin-bottom: 30px; }
    .workspace-btn { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); padding: 12px 14px; border-radius: 12px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: 0.2s; color: white; font-weight: 700; font-size: 14px; }
    .workspace-btn:hover { background: rgba(255,255,255,0.1); border-color: var(--primary); }
    .workspace-dropdown { position: absolute; top: 100%; left: 0; width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 12px; margin-top: 8px; overflow: hidden; box-shadow: 0 10px 25px rgba(0,0,0,0.5); z-index: 100; display: none; flex-direction: column; }
    .workspace-item { padding: 12px 14px; color: #cbd5e1; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: 0.2s; display: flex; align-items: center; gap: 8px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    .workspace-item:hover { background: rgba(255,255,255,0.05); color: white; }
    
    .filter-section { font-size: 11px; text-transform: uppercase; color: #64748b; font-weight: 700; margin-bottom: 12px; letter-spacing: 1px; padding-left: 8px; }
    .filter-list { list-style: none; padding: 0; margin: 0; display: flex; flex-direction: column; gap: 6px; }
    .filter-btn { background: transparent; color: #cbd5e1; border: none; padding: 10px 14px; border-radius: 10px; text-align: left; font-size: 13.5px; font-weight: 500; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; border-left: 3px solid transparent; width: 100%; cursor: pointer; }
    .filter-btn:hover { background: rgba(255,255,255,0.05); color: white; transform: translateX(4px); }
    .filter-count { background: rgba(0,0,0,0.4); padding: 2px 8px; border-radius: 12px; font-size: 11px; }

    .cat-row { display: flex; align-items: center; gap: 8px; flex-grow: 1; }
    .color-dot { appearance: none; -webkit-appearance: none; width: 12px; height: 12px; border: none; border-radius: 50%; cursor: pointer; padding: 0; background: transparent; }
    .cat-text { outline: none; padding: 2px 4px; border-radius: 4px; }
    
    .add-cat-wrapper { margin-top: 10px; padding: 0 8px; }
    .new-cat-input { width: 100%; background: rgba(255,255,255,0.05); border: 1px dashed rgba(255,255,255,0.2); color: white; padding: 10px 12px; border-radius: 8px; font-size: 13px; outline: none; box-sizing: border-box; transition: 0.2s; }
    .new-cat-input:focus { border-color: var(--primary); background: rgba(255,255,255,0.1); }

    /* Main Content */
    .main-content { margin-left: 280px; flex-grow: 1; padding: 40px 60px; background: linear-gradient(135deg, #f8fafc 0%, #f1f5f9 50%, #e2e8f0 100%); min-height: 100vh; }
    .header { margin-bottom: 30px; display: flex; justify-content: space-between; align-items: flex-end; padding-bottom: 20px; border-bottom: 1px solid #cbd5e1; }
    h1 { margin: 0; font-size: 36px; color: #0f172a; font-weight: 800; }

    /* Card Grid with Toggle Hover Effect */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); gap: 28px; }
    .card { background: white; border-radius: 24px; padding: 28px; box-shadow: 0 12px 30px -10px rgba(0,0,0,0.08); border: 1px solid #e2e8f0; border-top: 5px solid var(--theme-color); transition: transform 0.3s ease, box-shadow 0.3s ease; display: flex; flex-direction: column; position: relative; }
    .card:hover { transform: translateY(-8px) scale(1.01); box-shadow: 0 20px 40px -10px rgba(0,0,0,0.15); }
    
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
    .tag-select { border: none; padding: 6px 14px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; cursor: pointer; background: #f1f5f9; color: #334155; }
    .card-folder-select { background: transparent; border: 1px dashed #cbd5e1; padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 600; color: #64748b; cursor: pointer; }
    
    .quote-box { flex-grow: 1; background: #f8fafc; border-left: 4px solid var(--theme-color); padding: 18px 20px; font-style: italic; font-size: 14.5px; line-height: 1.6; color: #334155; margin-bottom: 20px; border-radius: 0 16px 16px 0; }
    
    .card-actions { display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid #f1f5f9; }
    .btn-group { display: flex; gap: 8px; }
    .btn { padding: 8px 16px; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; border: none; transition: 0.2s ease; display: inline-flex; align-items: center; justify-content: center; }
    .btn:hover { transform: translateY(-2px); filter: brightness(1.05); }
    .btn-apa { background: white; color: #475569; border: 1px solid #cbd5e1; }
    .btn-share { background: #f1f5f9; color: #0ea5e9; }
    .btn-teleport { background: var(--theme-color); color: white; }
    .btn-del { background: #fee2e2; color: #ef4444; border-radius: 50%; width: 32px; height: 32px; padding: 0; }

    /* Modal Styling */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(8px); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
    .modal-card { background: white; width: 650px; max-width: 100%; border-radius: 28px; padding: 36px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25); position: relative; max-height: 90vh; overflow-y: auto; border-top: 8px solid var(--modal-theme, #8b5cf6); }
    .modal-quote { background: #f8fafc; border-left: 5px solid var(--modal-theme, #8b5cf6); padding: 20px 24px; font-style: italic; font-size: 16px; line-height: 1.7; color: #1e293b; border-radius: 0 16px 16px 0; margin: 20px 0; }
    .btn-modal-ai { width: 100%; padding: 14px; border-radius: 14px; font-size: 14px; font-weight: 700; cursor: pointer; border: 1px solid #ddd6fe; background: linear-gradient(135deg, #f5f3ff 0%, #ede9fe 100%); color: #6d28d9; transition: 0.2s; }
    .btn-modal-ai:hover { transform: translateY(-2px); background: #ddd6fe; }
    .modal-ai-output { display: none; margin-top: 20px; padding: 20px; background: #fdfcff; border: 1px solid #ede9fe; border-left: 4px solid #8b5cf6; border-radius: 16px; }
    .visual-toggle { margin-top: 15px; background: #f8fafc; border: 1px solid #e2e8f0; padding: 10px; border-radius: 8px; cursor: pointer; }
    .glass-table { width: 100%; border-collapse: collapse; margin-top: 12px; }
    .glass-table th, .glass-table td { padding: 10px; border-bottom: 1px solid #e2e8f0; text-align: left; }
  </style>
</head>
<body>

  <aside class="sidebar">
    <div class="sidebar-title">Context Capsule</div>
    <div class="workspace-wrapper" id="workspace-switcher">
      <div class="workspace-btn" id="workspace-btn">
        <span>📂 <span id="active-workspace-name">General</span></span>
        <span style="font-size: 10px; color: #94a3b8;">▼</span>
      </div>
      <div class="workspace-dropdown" id="workspace-dropdown"></div>
    </div>

    <div class="filter-section">Tags in Workspace</div>
    <ul class="filter-list" id="sidebar-filters"></ul>
    
    <div class="add-cat-wrapper">
      <input type="text" id="add-new-cat" class="new-cat-input" placeholder="+ Add New Tag" />
    </div>
  </aside>

  <main class="main-content">
    <div class="header">
      <div>
        <h1 id="page-title">All Capsules</h1>
        <p style="color: var(--text-muted); margin: 8px 0 0 0; font-size: 15px;">Your captured knowledge, perfectly organized.</p>
      </div>
    </div>
    <div id="capsule-grid" class="grid"></div>
  </main>

  <div class="modal-overlay" id="elaborate-modal">
    <div class="modal-card" id="modal-card-box">
      <button id="close-modal-btn" style="position: absolute; top: 24px; right: 24px; background: #f1f5f9; border: none; width: 36px; height: 36px; border-radius: 50%; cursor: pointer; font-weight: bold;">✖</button>
      <div id="modal-body-content"></div>
    </div>
  </div>

  <script src="dashboard.js"></script>
</body>
</html>
