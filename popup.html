<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    :root { --bg: #0f172a; --card-bg: #1e293b; --border: #334155; --text-main: #f8fafc; --text-sub: #94a3b8; --accent: #38bdf8; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { width: 380px; max-height: 520px; background: var(--bg); color: var(--text-main); padding: 16px; overflow-x: hidden; }
    
    .header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 12px; border-bottom: 1px solid var(--border); margin-bottom: 14px; }
    .header h2 { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 6px; }
    .counter { background: var(--border); color: var(--text-sub); font-size: 11px; padding: 2px 8px; border-radius: 12px; font-weight: 600; }
    
    #clip-list { display: flex; flex-direction: column; gap: 10px; max-height: 360px; overflow-y: auto; padding-right: 4px; }
    #clip-list::-webkit-scrollbar { width: 5px; }
    #clip-list::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
    
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 8px; padding: 12px; transition: border-color 0.2s ease; }
    .card:hover { border-color: var(--accent); }
    .quote { font-size: 12.5px; line-height: 1.45; font-weight: 600; color: #f1f5f9; margin-bottom: 6px; font-style: italic; border-left: 2px solid var(--accent); padding-left: 8px; }
    .context { font-size: 11px; line-height: 1.4; color: var(--text-sub); margin-bottom: 12px; }
    
    .actions { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.05); padding-top: 10px; gap: 8px; }
    
    /* Dual Dropdown Styling */
    .dropdown-group { display: flex; gap: 6px; flex-grow: 1; }
    .ui-select { background: #0f172a; color: var(--accent); border: 1px solid var(--border); padding: 4px 6px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer; outline: none; width: 50%; text-overflow: ellipsis; }
    .ui-select:focus { border-color: var(--accent); }
    .ui-select.folder { color: #f8fafc; background: #1e293b; }
    
    .btn-group { display: flex; gap: 6px; }
    .icon-btn { background: none; border: none; font-size: 11px; font-weight: 600; cursor: pointer; padding: 4px 8px; border-radius: 4px; transition: 0.2s; }
    .teleport-btn { color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
    .teleport-btn:hover { background: rgba(56, 189, 248, 0.2); }
    .delete-btn { color: #ef4444; background: rgba(239, 68, 68, 0.1); }
    .delete-btn:hover { background: rgba(239, 68, 68, 0.2); }
    
    .footer { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
    .primary-btn { width: 100%; background: linear-gradient(135deg, #0284c7 0%, #2563eb 100%); color: #fff; border: none; padding: 10px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2); transition: 0.2s; }
    .primary-btn:hover { opacity: 0.9; }
  </style>
</head>
<body>
  <div class="header">
    <h2>⚡ Context Capsule</h2>
    <span class="counter" id="clip-count">0</span>
  </div>
  <div id="clip-list"></div>
  <div class="footer">
    <button id="open-dashboard" class="primary-btn">View Visual Knowledge Map ↗</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
